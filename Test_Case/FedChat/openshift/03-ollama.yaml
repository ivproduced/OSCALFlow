apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: fedchat
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi  # Large models require significant storage
---
apiVersion: v1
kind: Service
metadata:
  name: fedchat-ollama
  namespace: fedchat
  labels:
    app: ollama
spec:
  ports:
    - port: 11434
      targetPort: 11434
      name: ollama
  selector:
    app: ollama
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedchat-ollama
  namespace: fedchat
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      serviceAccountName: fedchat-sa
      # GPU node selector (comment out if no GPU)
      nodeSelector:
        nvidia.com/gpu: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001  # Non-root user for OpenShift
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 11434
          protocol: TCP
          name: ollama
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        - name: HOME
          value: "/tmp"  # Override HOME for non-root
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1001
        volumeMounts:
        - name: ollama-storage
          mountPath: /.ollama  # Changed from /root/.ollama for non-root
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "16Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1  # Request 1 GPU
          limits:
            memory: "32Gi"
            cpu: "8000m"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-pvc
      - name: tmp
        emptyDir: {}
      # Toleration for GPU nodes
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
---
# ConfigMap for pulling models on initialization
apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-init
  namespace: fedchat
data:
  init-models.sh: |
    #!/bin/sh
    # Wait for Ollama service to be ready
    echo "Waiting for Ollama to be ready..."
    until curl -f http://localhost:11434/api/tags > /dev/null 2>&1; do
      sleep 5
    done
    
    echo "Pulling required models..."
    curl -X POST http://localhost:11434/api/pull -d '{"name": "llama3:70b"}'
    curl -X POST http://localhost:11434/api/pull -d '{"name": "nomic-embed-text"}'
    
    echo "Models pulled successfully"
