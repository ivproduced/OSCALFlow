apiVersion: policy/v1
kind: NetworkPolicy
metadata:
  name: fedchat-network-policy
  namespace: fedchat
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: fedchat
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx  # Allow ingress controller
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: fedchat
  - to:  # Allow DNS
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - port: 53
      protocol: UDP
  - to:  # Allow external HTTPS (for FedRAMP APIs if configured)
    ports:
    - port: 443
      protocol: TCP
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fedchat-quota
  namespace: fedchat
spec:
  hard:
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: fedchat-limits
  namespace: fedchat
spec:
  limits:
  - max:
      memory: "8Gi"
      cpu: "4"
    min:
      memory: "128Mi"
      cpu: "100m"
    default:
      memory: "1Gi"
      cpu: "500m"
    defaultRequest:
      memory: "512Mi"
      cpu: "250m"
    type: Container
