apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fedchat-ingress
  namespace: fedchat
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # If using cert-manager
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"  # For file uploads
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
spec:
  tls:
  - hosts:
    - fedchat.agency.gov
    secretName: fedchat-tls
  rules:
  - host: fedchat.agency.gov
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: fedchat-backend
            port:
              number: 8000
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: fedchat-backend
            port:
              number: 9090
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fedchat-frontend
            port:
              number: 3000
---
# If using TLS with a provided certificate
apiVersion: v1
kind: Secret
metadata:
  name: fedchat-tls
  namespace: fedchat
type: kubernetes.io/tls
stringData:
  # Replace with your actual certificate and key
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    # Your certificate here
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    # Your private key here
    -----END PRIVATE KEY-----
