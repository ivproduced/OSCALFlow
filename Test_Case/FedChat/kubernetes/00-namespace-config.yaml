apiVersion: v1
kind: Namespace
metadata:
  name: fedchat
  labels:
    name: fedchat
    classification: moderate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fedchat-config
  namespace: fedchat
data:
  # Agency Configuration
  AGENCY_NAME: "Federal Agency"
  CLASSIFICATION_LEVEL: "MODERATE"
  
  # Application
  NODE_ENV: "production"
  API_URL: "http://fedchat-backend:8000"
  FRONTEND_URL: "http://fedchat-frontend:3000"
  
  # LLM Configuration
  LLM_PROVIDER: "local"
  LOCAL_LLM_BASE_URL: "http://fedchat-ollama:11434"
  LOCAL_LLM_MODEL: "llama3:70b"
  LOCAL_EMBEDDING_MODEL: "nomic-embed-text"
  
  # RAG Configuration
  ENABLE_RAG: "true"
  RAG_CHUNK_SIZE: "1000"
  RAG_CHUNK_OVERLAP: "200"
  RAG_TOP_K: "5"
  DOCUMENT_STORAGE_PATH: "/data/documents"
  
  # Guardrails
  ENABLE_GUARDRAILS: "true"
  ENABLE_PII_DETECTION: "true"
  PII_REDACTION_MODE: "mask"
  ENABLE_CONTENT_FILTER: "true"
  
  # MCP
  ENABLE_MCP: "true"
  MCP_SERVERS_CONFIG: "/app/mcp-servers/config.json"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "30"
  
  # Auth
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_HOURS: "24"
  SESSION_LIFETIME_HOURS: "8"
  
  # Audit & Logging
  AUDIT_LOG_LEVEL: "comprehensive"
  AUDIT_RETENTION_DAYS: "2555"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  
  # Feature Flags
  ENABLE_FILE_UPLOAD: "true"
  ENABLE_CONVERSATION_EXPORT: "true"
  ALLOW_REGISTRATION: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: fedchat-secrets
  namespace: fedchat
type: Opaque
stringData:
  # Database
  POSTGRES_PASSWORD: "CHANGE_THIS_SECURE_PASSWORD"
  POSTGRES_USER: "fedchat_user"
  POSTGRES_DB: "fedchat"
  DATABASE_URL: "postgresql://fedchat_user:CHANGE_THIS_SECURE_PASSWORD@fedchat-postgres:5432/fedchat"
  
  # Redis
  REDIS_PASSWORD: "CHANGE_THIS_REDIS_PASSWORD"
  REDIS_URL: "redis://:CHANGE_THIS_REDIS_PASSWORD@fedchat-redis:6379/0"
  
  # JWT & Session
  JWT_SECRET: "CHANGE_THIS_TO_A_SECURE_RANDOM_STRING_AT_LEAST_32_CHARS"
  SESSION_SECRET: "CHANGE_THIS_TO_ANOTHER_SECURE_RANDOM_STRING"
  
  # Azure OpenAI (if using)
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""
  
  # AWS (if using)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  
  # ServiceNow MCP Integration
  SERVICENOW_INSTANCE_URL: ""
  SERVICENOW_USERNAME: ""
  SERVICENOW_PASSWORD: ""
  
  # Splunk MCP Integration
  SPLUNK_HOST: ""
  SPLUNK_PORT: "8089"
  SPLUNK_API_TOKEN: ""
